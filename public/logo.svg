<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="pulseMask">
      <!-- Everything white is fully visible -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- Black stroke cuts a gap through the shapes -->
      <polyline points="10,50 32,50 42,22 55,84 66,40 76,50 90,50" fill="none" stroke="black" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Subtle Primary Orbit/Halo -->
  <circle cx="50" cy="50" r="48" fill="oklch(0.600 0.118 184.692)" fill-opacity="0.12"/>
  
  <!-- Masked Medical Cross -->
  <g mask="url(#pulseMask)">
    <rect x="36" y="14" width="28" height="72" rx="4" fill="oklch(0.600 0.118 184.692)"/>
    <rect x="14" y="36" width="72" height="28" rx="4" fill="oklch(0.600 0.118 184.692)"/>
  </g>
  
  <!-- Colored Heartbeat Trace perfectly suspended in the gap -->
  <polyline points="10,50 32,50 42,22 55,84 66,40 76,50 90,50" fill="none" stroke="oklch(0.600 0.118 184.692)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Pulsing Dot effect on the tip -->
  <circle cx="90" cy="50" r="3" fill="oklch(0.600 0.118 184.692)" />
</svg>
